name: Registry
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Builds both platforms without pushing, so a change to the Dockerfile or the
  # install scripts is checked before it reaches main.
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # The vela CLI baked into the image. Bump when the image should ship a newer
  # CLI; it does not track the image tag.
  VELA_VERSION: v1.11.0

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.1
      - name: Get the version
        id: get_version
        run: |
          # Every branch of this has to produce a valid image tag, including the
          # pull request refs, which are not pushed but are still tagged.
          case "${GITHUB_REF}" in
            refs/tags/*)     VERSION=${GITHUB_REF#refs/tags/} ;;
            refs/heads/main) VERSION=latest ;;
            refs/pull/*)     VERSION=pr-$(echo "${GITHUB_REF}" | cut -d/ -f3) ;;
            *)               VERSION=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-') ;;
          esac
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Get git revision
        id: vars
        shell: bash
        run: |
          echo "git_revision=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      # Skipped on pull requests: nothing is pushed there, and a fork's run has
      # no access to the registry secrets.
      - name: Login ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login docker.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        name: Build & push cloudshell to Docker Hub and GHCR
        with:
          context: .
          file: Dockerfile
          labels: |-
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
            VELA_VERSION=${{ env.VELA_VERSION }}
          tags: |-
            docker.io/oamdev/cloudshell:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/oamdev/cloudshell:${{ steps.get_version.outputs.VERSION }}
